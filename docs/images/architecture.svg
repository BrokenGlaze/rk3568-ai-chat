<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 584" width="720" height="584" role="img" aria-label="RK3568 AI 聊天终端系统架构">
  <defs>
    <marker id="arrowNeutral" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#52525B"/>
    </marker>
    <marker id="arrowBrand" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#4B3FE3"/>
    </marker>
  </defs>

  <text x="40" y="28" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="16" font-weight="600" fill="#171717">系统架构</text>

  <!-- 云端 -->
  <rect x="190" y="48" width="340" height="64" rx="8" fill="#F7F7F8" stroke="#71717A" stroke-width="1.5"/>
  <text x="210" y="79" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#171717">DeepSeek API</text>
  <text x="210" y="100" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#52525B">HTTPS / TLS · 云端大模型</text>

  <!-- 应用层 -->
  <rect x="40" y="140" width="640" height="80" rx="8" fill="#F2F7FF" stroke="#4B3FE3" stroke-width="1.5"/>
  <text x="60" y="173" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#1A1759">应用层</text>
  <text x="60" y="197" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#52525B">登录 · 桌面 Launcher · DeepSeek 聊天 · 快捷设置</text>

  <!-- 图形框架 -->
  <rect x="40" y="252" width="300" height="80" rx="8" fill="#F7F7F8" stroke="#D4D4D8" stroke-width="1.5"/>
  <text x="60" y="285" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#171717">图形框架 lvgl/</text>
  <text x="60" y="307" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#52525B">LVGL 9.x · FreeType · libjpeg-turbo</text>

  <!-- 通信层 -->
  <rect x="380" y="252" width="300" height="80" rx="8" fill="#F2F7FF" stroke="#4B3FE3" stroke-width="1.5"/>
  <text x="400" y="285" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#1A1759">通信层 chat_ds/</text>
  <text x="400" y="307" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#52525B">TLS / HTTP · cJSON · 对话历史</text>

  <!-- 内核接口 -->
  <rect x="40" y="364" width="640" height="64" rx="8" fill="#F7F7F8" stroke="#D4D4D8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="392" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#171717">内核接口 / 设备节点</text>
  <text x="60" y="414" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#52525B">/dev/fb0 · /dev/dri · /dev/input · /sys/class/backlight</text>

  <!-- 硬件 -->
  <rect x="40" y="452" width="640" height="64" rx="8" fill="#F7F7F8" stroke="#D4D4D8" stroke-width="1.5"/>
  <text x="60" y="480" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#171717">RK3568 硬件</text>
  <text x="60" y="502" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#52525B">LCD 触摸屏 · 背光 · 以太网 / Wi-Fi</text>

  <!-- 连接线 -->
  <line x1="360" y1="452" x2="360" y2="430" stroke="#52525B" stroke-width="1.5" marker-end="url(#arrowNeutral)"/>
  <line x1="190" y1="364" x2="190" y2="334" stroke="#52525B" stroke-width="1.5" marker-end="url(#arrowNeutral)"/>
  <line x1="530" y1="364" x2="530" y2="334" stroke="#4B3FE3" stroke-width="1.7" marker-end="url(#arrowBrand)"/>
  <line x1="190" y1="252" x2="190" y2="224" stroke="#52525B" stroke-width="1.5" marker-end="url(#arrowNeutral)"/>
  <line x1="530" y1="252" x2="530" y2="224" stroke="#4B3FE3" stroke-width="1.7" marker-end="url(#arrowBrand)"/>
  <line x1="360" y1="140" x2="360" y2="116" stroke="#4B3FE3" stroke-width="1.7" marker-end="url(#arrowBrand)"/>

  <!-- 图例 -->
  <rect x="40" y="533" width="12" height="12" rx="3" fill="#F2F7FF" stroke="#4B3FE3" stroke-width="1.5"/>
  <text x="58" y="544" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#52525B">核心链路</text>
  <rect x="200" y="533" width="12" height="12" rx="3" fill="#F7F7F8" stroke="#D4D4D8" stroke-width="1.5"/>
  <text x="218" y="544" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#52525B">内部模块</text>
  <rect x="340" y="533" width="12" height="12" rx="3" fill="#F7F7F8" stroke="#D4D4D8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="358" y="544" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#52525B">系统接口</text>
  <rect x="480" y="533" width="12" height="12" rx="3" fill="#F7F7F8" stroke="#71717A" stroke-width="1.5"/>
  <text x="498" y="544" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#52525B">外部服务</text>
</svg>
